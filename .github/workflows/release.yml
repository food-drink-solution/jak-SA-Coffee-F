name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: read

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT
          echo "Processing release for tag: $TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'jak-sa/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./jak-sa
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gates
        run: |
          node scripts/validate-data.mjs
          pnpm --dir jak-sa lint
          pnpm --dir jak-sa typecheck
          pnpm --dir jak-sa test

      - name: Build Production Application
        working-directory: ./jak-sa
        run: pnpm build

      - name: Create Release Asset Archive
        run: |
          mkdir -p release-dist
          tar -czf release-dist/jak-sa-storefront-${{ steps.tag_info.outputs.TAG_NAME }}.tar.gz \
            --exclude='jak-sa/node_modules' \
            --exclude='jak-sa/.git' \
            jak-sa/package.json \
            jak-sa/public \
            jak-sa/next.config.ts \
            jak-sa/.next

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: "JAK Platform ${{ steps.tag_info.outputs.TAG_NAME }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-dist/jak-sa-storefront-${{ steps.tag_info.outputs.TAG_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
